[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-reviewer"
version = "0.1.0"
description = "Stock screening with standalone HTML reports and CSV history"
readme = "docs/README.md"
requires-python = ">=3.9"
dependencies = ["pandas==2.2.3", "yfinance==0.2.66", "peewee>=3.16.2,<4"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.16.10", "mypy==1.19.1", "pandas-stubs==2.2.2.240807"]

[project.scripts]
stock-reviewer = "stock_reviewer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
addopts = "-m 'not live'"
markers = ["live: opt-in Yahoo connectivity checks"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.mypy]
python_version = "3.9"
files = ["src/stock_reviewer"]
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
